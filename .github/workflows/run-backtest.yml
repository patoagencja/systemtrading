name: Run Backtest

# Manually triggered backtest. Results are saved to database and dashboard rebuilt.
# Default: from 2020-01-01 to today.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD). Leave blank to use 2020-01-01."
        required: false
        default: "2020-01-01"
      reset:
        description: "Clear existing backtest data before running?"
        type: boolean
        default: true
      compare_all:
        description: "Run 4-way exit logic comparison (LEGACY, FIXED_TP, TRAILING_AFTER_10, TRAILING_ONLY)?"
        type: boolean
        default: false
      cost_scenario:
        description: "Cost scenario"
        type: choice
        options: [BASE, LOW, STRESS]
        default: BASE

permissions:
  contents: write

concurrency:
  group: paper-trader-db
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: market-edge-paper-trader
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure database and watchlist exist
        run: |
          python scripts/init_db.py
          python scripts/seed_watchlist.py

      - name: Clear previous backtest data
        if: ${{ github.event.inputs.reset == 'true' }}
        run: python scripts/reset_portfolio.py --force --mode backtest

      - name: Run backtest
        run: |
          COMPARE_FLAG=""
          if [ "${{ github.event.inputs.compare_all }}" = "true" ]; then
            COMPARE_FLAG="--compare-all"
          fi
          python scripts/run_backtest.py \
            --start "${{ github.event.inputs.start_date }}" \
            --cost-scenario "${{ github.event.inputs.cost_scenario }}" \
            $COMPARE_FLAG

      - name: Build dashboard
        env:
          DASHBOARD_PASSWORD: "trading2025"
        run: python scripts/build_dashboard_html.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database.sqlite ../docs
          git commit -m "Backtest from ${{ github.event.inputs.start_date }} [skip ci]" || echo "No changes"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push

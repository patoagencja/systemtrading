name: EOD Scan — Generate Signals

# Runs after US market close to close any remaining positions and generate
# new signals for next-day entry (which happens via morning-entry.yml).
# Scheduled run works automatically ONLY on the repository's default branch.

on:
  schedule:
    # 20:30 UTC = 16:30 ET, 30 min after US market close
    - cron: "30 20 * * 1-5"
  workflow_dispatch:
    inputs:
      reset:
        description: "Reset portfolio before scanning (start fresh)?"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-trader-db
  cancel-in-progress: false

jobs:
  eod-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-paper-trader
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure database and watchlist exist
        run: |
          python scripts/init_db.py
          python scripts/seed_watchlist.py

      - name: Optional reset
        if: ${{ github.event.inputs.reset == 'true' }}
        run: python scripts/reset_portfolio.py --force

      - name: Run EOD scan (close positions + generate signals)
        run: python scripts/run_scan.py

      - name: Build static HTML dashboard
        env:
          DASHBOARD_PASSWORD: "trading2025"
        run: python scripts/build_dashboard_html.py

      - name: Commit updated database and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database.sqlite ../docs
          git commit -m "EOD scan: close positions + new signals [skip ci]" || echo "No changes to commit"
          git push

# market-edge-intraday — on-demand backtest.
# Named "mei-*" to avoid overwriting the sibling project's intraday-backtest.yml.
#
# This workflow needs REAL market data. Add these REPO SECRETS first:
#   ALPACA_API_KEY     (Settings -> Secrets and variables -> Actions)
#   ALPACA_SECRET_KEY
# Without them the backtest script exits non-zero on purpose (it never fabricates data).
name: Intraday Backtest (market-edge-intraday)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
      strategies:
        description: "Comma-separated strategy names (blank = configured defaults)"
        required: false
        default: ""
      cost_scenario:
        description: "Cost scenario"
        type: choice
        options: [LOW, BASE, STRESS]
        default: BASE
      symbols:
        description: "Comma-separated tickers, e.g. AAPL,MSFT,NVDA"
        required: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: market-edge-intraday
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      INTRADAY_TEST_DB_URL: "sqlite:///./backtest.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: market-edge-intraday/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialise database
        run: python scripts/init_database.py

      - name: Run backtest
        run: |
          python scripts/run_backtest.py \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ github.event.inputs.end_date }}" \
            --symbols "${{ github.event.inputs.symbols }}" \
            --strategies "${{ github.event.inputs.strategies }}" \
            --cost-scenario "${{ github.event.inputs.cost_scenario }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-backtest-reports
          path: market-edge-intraday/reports/
          if-no-files-found: ignore

# market-edge-intraday — build the Docker image to prove it builds.
# Does NOT push to any registry. Named "mei-*" to avoid clashing with sibling workflows.
name: Intraday Docker Build (market-edge-intraday)

on:
  push:
    paths:
      - "market-edge-intraday/**"
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: market-edge-intraday
          file: market-edge-intraday/Dockerfile
          push: false
          tags: market-edge-intraday:ci
          load: true

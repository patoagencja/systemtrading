# market-edge-intraday — full local stack.
# PAPER TRADING ONLY. No real broker connection, no real orders, no real money.
#
# Quick start:
#   cp .env.example .env       # then add your data API key
#   docker compose up -d
#   open http://localhost:8501 (dashboard) and http://localhost:8000/docs (api)

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intraday}
      POSTGRES_USER: ${POSTGRES_USER:-intraday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intraday}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intraday} -d ${POSTGRES_DB:-intraday}"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "scripts/run_live_paper.py", "--yes"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "scripts/health_check.py"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    command:
      - streamlit
      - run
      - dashboard/streamlit_app.py
      - --server.port
      - "8501"
      - --server.address
      - "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  pgdata:

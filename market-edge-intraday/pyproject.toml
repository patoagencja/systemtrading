[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-edge-intraday"
version = "1.0.0"
description = "Intraday paper-trading research engine (virtual capital only, no real orders)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", "data", "reports"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default arg (FastAPI Depends idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["migrations/", "tests/", "dashboard/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: integration tests that may need a database or network",
    "live: tests that require live market-data credentials",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/api/*", "app/alerts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
